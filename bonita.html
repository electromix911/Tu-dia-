<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feliz Día de la Enfermera 💜</title>

  <!-- Fuente bonita -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background: linear-gradient(135deg,#1e1e2f,#3b1c5a);
      font-family:'Poppins',sans-serif;
      position:relative;
    }

    /* Corazones flotando */
    .heart{
      position:absolute;
      color:#c77dff;
      font-size:25px;
      animation: float 6s linear infinite;
      opacity:.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-120px) scale(1.5);
      }
    }

    .card{
      width:360px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius:25px;
      padding:20px;
      text-align:center;
      box-shadow:0 10px 35px rgba(0,0,0,.4);
      animation: aparecer 1.5s ease;
      border:1px solid rgba(255,255,255,0.2);
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .foto{
      width:170px;
      height:170px;
      border-radius:50%;
      object-fit:cover;
      border:5px solid #c77dff;
      box-shadow:0 0 25px rgba(199,125,255,.7);
      margin-top:10px;
    }

    h1{
      margin-top:18px;
      color:white;
      font-size:28px;
      font-family:'Dancing Script',cursive;
    }

    .fecha{
      margin-top:5px;
      color:#ddd;
      font-size:14px;
    }

    .mensaje{
      margin-top:18px;
      color:white;
      line-height:1.7;
      font-size:17px;
      font-weight:300;
      padding:10px;
    }

    .mensaje span{
      color:#d0a2ff;
      font-weight:bold;
    }

    .texto-img{
      width:100%;
      margin-top:18px;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,.4);
    }

    .firma{
      margin-top:18px;
      color:#f3d1ff;
      font-family:'Dancing Script',cursive;
      font-size:28px;
    }

  </style>
</head>

<body>

  <!-- Corazones -->
  <div class="heart" style="left:10%; animation-delay:0s;">💜</div>
  <div class="heart" style="left:25%; animation-delay:2s;">💜</div>
  <div class="heart" style="left:50%; animation-delay:4s;">💜</div>
  <div class="heart" style="left:70%; animation-delay:1s;">💜</div>
  <div class="heart" style="left:90%; animation-delay:3s;">💜</div>

  <div class="card">

    <!-- FOTO DE ELLA -->
    <!-- Cambia "foto.jpg" por la foto de ella -->
    <img src="foto.jpg" class="foto">

    <h1>Feliz Día Internacional de la Enfermera 💉💜</h1>

    <div class="fecha">
      12 de Mayo ✨
    </div>

    <div class="mensaje">
      <span>Físicamente bonita,</span><br>
      mentalmente fuerte,<br>
      emocionalmente valiente,<br>
      y profesionalmente…<br>
      <span>ENFERMERA 💜</span>
    </div>

    <!-- TU IMAGEN CON TEXTO -->
    <!-- Cambia "mensaje.jpg" por la imagen que me enviaste -->
    <img src="mensaje.jpg" class="texto-img">

    <div class="firma">
      Para una futura enfermera increíble 🌷
    </div>

  </div>

</body>
</html>
